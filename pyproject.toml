[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joint-ttopt"
version = "1.0.0"
description = "Joint Test-Time Optimization from Multi-Agent Interaction of Large Language Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
models = ["torch>=2.6,<3", "transformers==4.57.3", "accelerate>=1.5,<2", "safetensors>=0.4", "pydantic>=2,<3"]
recovery = ["cvxpy>=1.5,<2", "clarabel>=0.9"]
test = ["pytest>=8,<9"]

[project.scripts]
joint-ttopt = "joint_ttopt.cli:main"

[tool.setuptools.packages.find]
include = ["joint_ttopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
